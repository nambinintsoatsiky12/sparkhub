name: Mettre à jour les prix

on:
  schedule:
    - cron: '0 8 * * *'  # Tous les jours à 8h
  workflow_dispatch:    # Pour lancer manuellement depuis GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests beautifulsoup4
      - run: python update_prices.py
        env:
          # Tu pourras y mettre des secrets plus tard (clés API, etc.)
          PYTHONUNBUFFERED: 1
