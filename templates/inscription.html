<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — SparkHub</title>
    <link rel="icon" href="{{ url_for('static', filename='images/logo.svg') }}" type="image/svg+xml">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Inter', sans-serif; background: #fafafa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.06); max-width: 420px; width: 100%; }
        .container h1 { font-size: 1.8rem; margin-bottom: 8px; }
        .container p { color: #6b7280; margin-bottom: 24px; }
        input { width: 100%; padding: 14px 16px; border: 1px solid #e5e7eb; border-radius: 12px; margin-bottom: 16px; font-size: 1rem; }
        button { background: #f97316; color: white; border: none; padding: 14px; border-radius: 40px; font-weight: 700; width: 100%; cursor: pointer; font-size: 1rem; }
        button:hover { background: #ea580c; }
        .flash { padding: 12px; border-radius: 12px; margin-bottom: 16px; }
        .flash.success { background: #d1fae5; color: #065f46; }
        .flash.danger { background: #fee2e2; color: #991b1b; }
        a { color: #f97316; text-decoration: none; }
        a:hover { text-decoration: underline; }
        @media (max-width: 480px) { .container { padding: 24px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Inscription</h1>
        <p>Créez un compte pour accéder à toutes les fonctionnalités.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Mot de passe" required>
            <input type="password" name="confirm_password" placeholder="Confirmer le mot de passe" required>
            <button type="submit">S'inscrire</button>
        </form>
        <p style="text-align:center; margin-top:16px;">Déjà un compte ? <a href="/connexion">Se connecter</a></p>
    </div>
</body>
  </html>
