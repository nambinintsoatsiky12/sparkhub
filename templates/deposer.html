<!DOCTYPE html>
<html>
<head>
    <title>Déposer une annonce</title>
    <link rel="icon" href="{{ url_for('static', filename='images/logo.svg') }}" type="image/svg+xml">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fafafa; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .form-box { background: white; padding: 30px; border-radius: 24px; border: 1px solid #e5e7eb; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid #e5e7eb; border-radius: 12px; font-size: 1rem; }
        button { background: #f97316; color: white; border: none; padding: 14px; border-radius: 40px; font-weight: 700; width: 100%; cursor: pointer; }
        button:hover { background: #ea580c; }
        .navbar { padding: 16px 30px; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.04); display: flex; justify-content: space-between; align-items: center; }
        .navbar img { height: 38px; }
        .navbar a { color: #0f172a; text-decoration: none; font-weight: 600; }
        footer { text-align: center; padding: 25px; background: #0f172a; color: #cbd5e1; margin-top: 40px; }
        footer strong { color: #f97316; }
    </style>
</head>
<body>
    <nav class="navbar">
        <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="SparkHub">
        <a href="/">Accueil</a>
    </nav>
    <div class="container">
        <h1>📝 Déposer une annonce</h1>
        <div class="form-box">
            <form method="POST">
                <input type="text" name="titre" placeholder="Titre du produit" required>
                <textarea name="description" rows="4" placeholder="Description..." required></textarea>
                <input type="text" name="prix" placeholder="Prix (ex: 50 000 Ar)" required>
                <input type="text" name="contact" placeholder="Contact (tél, email...)" required>
                <button type="submit">Publier l’annonce</button>
            </form>
        </div>
        <a href="/marketplace" style="display:inline-block; margin-top:20px; color:#f97316; text-decoration:none;">← Retour à la Marketplace</a>
    </div>
    <footer>
        <p>&copy; {{ year }} SparkHub — Développé par <strong>Seïkī</strong></p>
    </footer>
</body>
  </html>
