<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier l'annonce — SparkHub</title>
    <link rel="icon" href="{{ url_for('static', filename='images/logo.svg') }}" type="image/svg+xml">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Inter', sans-serif; background: #fafafa; margin:0; padding:0; }
        .navbar { padding:16px 30px; background:rgba(255,255,255,0.9); backdrop-filter:blur(10px); border-bottom:1px solid rgba(0,0,0,0.04); display:flex; justify-content:space-between; align-items:center; }
        .navbar img { height:38px; }
        .navbar a { color:#0f172a; text-decoration:none; font-weight:600; margin-left:16px; }
        .container { max-width:600px; margin:40px auto; padding:0 20px; }
        .form-box { background:white; padding:30px; border-radius:24px; border:1px solid #e5e7eb; }
        input, textarea, select { width:100%; padding:12px; border:1px solid #e5e7eb; border-radius:12px; margin-bottom:16px; font-size:1rem; font-family:inherit; }
        button { background:#f97316; color:white; border:none; padding:14px; border-radius:40px; font-weight:700; width:100%; cursor:pointer; font-size:1rem; }
        button:hover { background:#ea580c; }
        footer { text-align:center; padding:25px; background:#0f172a; color:#cbd5e1; margin-top:40px; }
        footer strong { color:#f97316; }
        @media (max-width:600px) { .navbar { flex-wrap:wrap; gap:10px; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="SparkHub">
        <div>
            <a href="/">Accueil</a>
            <a href="/marketplace">Marketplace</a>
            <a href="/mon-compte">Mon compte</a>
        </div>
    </nav>
    <div class="container">
        <h1>✏️ Modifier l'annonce</h1>
        <div class="form-box">
            <form method="POST">
                <input type="text" name="titre" value="{{ annonce[0] }}" required>
                <textarea name="description" rows="4" required>{{ annonce[1] }}</textarea>
                <input type="text" name="prix" value="{{ annonce[2] }}" required>
                <input type="text" name="contact" value="{{ annonce[3] }}" required>
                <input type="text" name="image_url" value="{{ annonce[4] or '' }}" placeholder="Lien de l'image">
                <select name="categorie" required>
                    <option value="Technologie" {% if annonce[5] == 'Technologie' %}selected{% endif %}>💻 Technologie</option>
                    <option value="Alimentation" {% if annonce[5] == 'Alimentation' %}selected{% endif %}>🍎 Alimentation</option>
                    <option value="Mode" {% if annonce[5] == 'Mode' %}selected{% endif %}>👗 Mode</option>
                    <option value="Maison" {% if annonce[5] == 'Maison' %}selected{% endif %}>🏠 Maison</option>
                    <option value="Véhicules" {% if annonce[5] == 'Véhicules' %}selected{% endif %}>🚗 Véhicules</option>
                    <option value="Services" {% if annonce[5] == 'Services' %}selected{% endif %}>🛠️ Services</option>
                    <option value="Autre" {% if annonce[5] == 'Autre' %}selected{% endif %}>📦 Autre</option>
                </select>
                <button type="submit">Enregistrer les modifications</button>
            </form>
        </div>
        <a href="/mon-compte" style="display:inline-block; margin-top:20px; color:#f97316; text-decoration:none;">← Retour à mon compte</a>
    </div>
    <footer>
        <p>&copy; {{ year }} SparkHub — Développé par <strong>Seïkī</strong></p>
    </footer>
</body>
</html>
