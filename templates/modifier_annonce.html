<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier l'annonce — SparkHub</title>
    <link rel="icon" href="{{ url_for('static', filename='images/logo.svg') }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    {% set active = 'marketplace' %}
    {% include '_nav.html' %}

    <main class="container-narrow">
        <header class="page-head">
            <span class="eyebrow">Marketplace</span>
            <h1>Modifier l'annonce</h1>
        </header>

        <div class="form-card mt-16">
            <form method="POST">
                <div class="field">
                    <label for="titre">Titre du produit</label>
                    <input class="input" id="titre" type="text" name="titre" value="{{ annonce[0] }}" required>
                </div>
                <div class="field">
                    <label for="description">Description</label>
                    <textarea class="textarea" id="description" name="description" rows="4" required>{{ annonce[1] }}</textarea>
                </div>
                <div class="grid grid-2">
                    <div class="field">
                        <label for="prix">Prix</label>
                        <input class="input" id="prix" type="text" name="prix" value="{{ annonce[2] }}" required>
                    </div>
                    <div class="field">
                        <label for="categorie">Catégorie</label>
                        <select class="select" id="categorie" name="categorie" required>
                            <option value="Technologie" {% if annonce[5] == 'Technologie' %}selected{% endif %}>Technologie</option>
                            <option value="Alimentation" {% if annonce[5] == 'Alimentation' %}selected{% endif %}>Alimentation</option>
                            <option value="Mode" {% if annonce[5] == 'Mode' %}selected{% endif %}>Mode</option>
                            <option value="Maison" {% if annonce[5] == 'Maison' %}selected{% endif %}>Maison</option>
                            <option value="Véhicules" {% if annonce[5] == 'Véhicules' %}selected{% endif %}>Véhicules</option>
                            <option value="Services" {% if annonce[5] == 'Services' %}selected{% endif %}>Services</option>
                            <option value="Autre" {% if annonce[5] == 'Autre' %}selected{% endif %}>Autre</option>
                        </select>
                    </div>
                </div>
                <div class="field">
                    <label for="contact">Contact</label>
                    <input class="input" id="contact" type="text" name="contact" value="{{ annonce[3] }}" required>
                </div>
                <div class="field">
                    <label for="image_url">Image (URL)</label>
                    <input class="input" id="image_url" type="text" name="image_url" value="{{ annonce[4] or '' }}" placeholder="Lien direct de l'image">
                </div>
                <button class="btn btn-primary btn-block" type="submit">Enregistrer les modifications</button>
            </form>
        </div>

        <p class="center mt-16"><a class="small" style="color:var(--green); font-weight:700;" href="/mon-compte">← Retour à mon compte</a></p>
    </main>
</body>
</html>
