<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon compte — SparkHub</title>
    <link rel="icon" href="{{ url_for('static', filename='images/logo.svg') }}" type="image/svg+xml">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Inter', sans-serif; background: #fafafa; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.06); max-width: 500px; width: 100%; }
        .container h1 { font-size: 1.8rem; margin-bottom: 8px; }
        .container p { color: #6b7280; margin-bottom: 24px; }
        .info { background: #f1f5f9; padding: 16px; border-radius: 12px; margin-bottom: 20px; }
        .info strong { color: #111827; }
        a { color: #f97316; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .btn { display: inline-block; background: #0f172a; color: white; padding: 12px 32px; border-radius: 40px; text-decoration: none; font-weight: 600; }
        .btn:hover { background: #f97316; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👤 Mon compte</h1>
        <p>Bienvenue sur votre espace personnel.</p>

        <div class="info">
            <p><strong>Email :</strong> {{ user.email }}</p>
            <p><strong>ID :</strong> #{{ user.id }}</p>
        </div>

        <p>📝 Vous pouvez déposer des annonces, gérer vos offres et consulter vos messages ici.</p>

        <div style="margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap;">
            <a href="/deposer-annonce" class="btn">📝 Déposer une annonce</a>
            <a href="/deconnexion" style="border: 1px solid #dc2626; color: #dc2626; padding: 12px 32px; border-radius: 40px; text-decoration: none; font-weight: 600;">🚪 Déconnexion</a>
        </div>

        <p style="margin-top: 20px;"><a href="/">← Retour à l'accueil</a></p>
    </div>
</body>
      </html>
